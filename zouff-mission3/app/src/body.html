<div id="app"></div>
<script>
const CARDS = /*__DATA__*/[];
const LS = 'zouff-m3-v2', LS_OLD = 'zouff-m3-v1';
const DEF = {ui:'nl', mode:'card', kind:'all', pages:[], order:'seq', unknown:false, front:'fr', other:true, dir:'nl-fr', accent:'lenient', speak:true};
let store = {users:[], cur:null, set:{}, legacy:null};
try {
  const r = localStorage.getItem(LS);
  if (r) store = Object.assign(store, JSON.parse(r));
  else {
    const o = localStorage.getItem(LS_OLD);
    if (o) { const p = JSON.parse(o); store.legacy = {known:p.known || {}, miss:p.miss || {}}; Object.assign(store.set, p.set || {}); }
  }
} catch (e) {}
const S = Object.assign({}, DEF, store.set || {});
S.ui = S.ui === 'tr' ? 'tr' : 'nl';
function save() { store.set = S; try { localStorage.setItem(LS, JSON.stringify(store)); } catch (e) {} }
const user = () => store.users.find(u => u.id === store.cur) || null;
const known = id => { const u = user(); return !!(u && u.known[id]); };

/* ---------- teksten / metinler ---------- */
const TX = {
  nl: {
    sub: 'Tu fais quoi? · pagina 25–42', gekend: 'gekend', hi: n => `Hoi, ${n}!`,
    switchKid: 'Ander kind', progress: 'Voortgang', what: 'Wat gaan we doen?',
    cardT: 'Kaartjes', cardD: 'Bekijk het woord, tik op het kaartje en draai het om voor het Turks.',
    writeT: 'Schrijven', writeD: 'Bekijk het woord en schrijf de vertaling.',
    face: 'Voorkant van het kaartje', dir: 'Richting', frontFr: 'Voorkant Frans', frontNl: 'Voorkant Nederlands',
    other: 'Toon ook de andere taal (Frans + Nederlands samen)',
    accL: 'Accentfout telt als goed (met waarschuwing)', accS: 'Accentfout telt als fout',
    content: 'Inhoud', all: 'Alles', words: 'Woorden', phrases: 'Zinnen',
    pages: "Pagina's", allPages: "Alle pagina's", pg: 'p.', order: 'Volgorde', seq: 'Zoals in het boek', shuf: 'Door elkaar',
    unk: 'Alleen wat ik nog niet ken', start: (n, m) => `Start · ${n} ${m === 'card' ? 'kaartjes' : 'vragen'}`, none: 'Geen kaartjes in deze selectie',
    foot: 'De voortgang wordt op deze iPad bewaard.', reset: 'Mijn voortgang wissen', resetSure: 'Zeker? Tik nog eens',
    tapHint: 'Tik op het kaartje voor het Turks', backHint: 'Tik om terug te draaien', turks: 'TURKS',
    again: 'Opnieuw ↻', know: 'Ik ken het ✓', againHint: 'Ken je het niet? Kies "Opnieuw", dan komt het kaartje achteraan.',
    listen: 'Beluister', close: 'Stoppen', flipLabel: 'Kaartje omdraaien',
    writeIn: l => `Schrijf in het ${l}`, hint: 'Turkse hint', check: 'Controleren', skip: 'Ik weet het niet, toon het antwoord', next: 'Volgende',
    ok: 'Juist!', near: 'Bijna: let op de accenten', accErr: 'Accentfout', right: 'Het juiste antwoord:', trLine: 'Turks:',
    done: 'Klaar!', first: (r, t) => `Eerste poging juist: ${r} / ${t}`, redo: n => `Om te herhalen (${n})`, allOk: 'Allemaal gekend. Super!',
    retry: 'Fouten opnieuw oefenen', homeB: 'Startscherm',
    who: 'Wie oefent er?', whoD: 'Kies je naam. Elk kind heeft zijn eigen voortgang.', add: 'Kind toevoegen', namePh: 'Voornaam', addB: 'Toevoegen',
    del: 'Verwijderen', delSure: 'Zeker? Tik nog eens', empty: 'Voeg eerst een naam toe om te starten.', hello: 'Dag', back: 'Terug',
    track: 'Voortgang van de kinderen', sessions: 'Oefensessies', last: 'Laatst geoefend', never: 'Nog niet geoefend', hardest: 'Moeilijkste woorden',
    perPage: 'Per pagina', noMiss: 'Nog geen fouten.', times: n => `${n}× fout`, choose: 'Kiezen', lang: 'Taal',
    LN: {fr:'Frans', nl:'Nederlands', tr:'Turks'},
    dirs: {'nl-fr':'Nederlands → Frans', 'fr-nl':'Frans → Nederlands', 'tr-fr':'Turks → Frans', 'tr-nl':'Turks → Nederlands'},
  },
  tr: {
    sub: 'Tu fais quoi? · sayfa 25–42', gekend: 'biliyor', hi: n => `Merhaba, ${n}!`,
    switchKid: 'Başka çocuk', progress: 'İlerleme', what: 'Ne yapalım?',
    cardT: 'Kart', cardD: 'Kelimeye bak, karta dokun, çevir ve Türkçesini gör.',
    writeT: 'Yazma', writeD: 'Kelimeyi gör, karşılığını yaz.',
    face: 'Kartın ön yüzü', dir: 'Yön', frontFr: 'Önde Fransızca', frontNl: 'Önde Felemenkçe',
    other: 'Diğer dili de göster (Fransızca + Felemenkçe birlikte)',
    accL: 'Aksan hatası kabul (uyarılı)', accS: 'Aksan hatası yanlış sayılır',
    content: 'İçerik', all: 'Hepsi', words: 'Kelimeler', phrases: 'Cümleler',
    pages: 'Sayfalar', allPages: 'Tüm sayfalar', pg: 's.', order: 'Sıra', seq: 'Kitaptaki sıra', shuf: 'Karışık',
    unk: 'Sadece henüz bilmediklerim', start: (n, m) => `Başla · ${n} ${m === 'card' ? 'kart' : 'soru'}`, none: 'Bu seçimde kart yok',
    foot: 'İlerleme bu iPad\'in tarayıcısında saklanır.', reset: 'İlerlememi sıfırla', resetSure: 'Emin misin? Tekrar dokun',
    tapHint: 'Türkçesi için karta dokun', backHint: 'Geri çevirmek için dokun', turks: 'TÜRKÇE',
    again: 'Tekrar ↻', know: 'Biliyorum ✓', againHint: 'Bilmiyorsan "Tekrar" de, kart sona eklenir.',
    listen: 'Dinle', close: 'Çık', flipLabel: 'Kartı çevir',
    writeIn: l => `${l} yaz`, hint: 'Türkçe ipucu', check: 'Kontrol et', skip: 'Bilmiyorum, cevabı göster', next: 'Sonraki',
    ok: 'Doğru!', near: 'Neredeyse: aksanlara dikkat', accErr: 'Aksan hatası', right: 'Doğrusu:', trLine: 'Türkçe:',
    done: 'Bitti!', first: (r, t) => `İlk denemede doğru: ${r} / ${t}`, redo: n => `Tekrar edilecekler (${n})`, allOk: 'Hepsini bildin. Harika!',
    retry: 'Hataları tekrar çalış', homeB: 'Ana ekran',
    who: 'Kim çalışıyor?', whoD: 'Adını seç. Her çocuğun kendi ilerlemesi var.', add: 'Çocuk ekle', namePh: 'Ad', addB: 'Ekle',
    del: 'Sil', delSure: 'Emin misin? Tekrar dokun', empty: 'Başlamak için önce bir ad ekle.', hello: 'Merhaba', back: 'Geri',
    track: 'Çocukların ilerlemesi', sessions: 'Çalışma oturumu', last: 'Son çalışma', never: 'Henüz çalışmadı', hardest: 'En zorlandığı kelimeler',
    perPage: 'Sayfa sayfa', noMiss: 'Henüz hata yok.', times: n => `${n}× yanlış`, choose: 'Seç', lang: 'Dil',
    LN: {fr:'Fransızca', nl:'Felemenkçe', tr:'Türkçe'},
    dirs: {'nl-fr':'Felemenkçe → Fransızca', 'fr-nl':'Fransızca → Felemenkçe', 'tr-fr':'Türkçe → Fransızca', 'tr-nl':'Türkçe → Felemenkçe'},
  }
};
const t = (k, ...a) => { const v = TX[S.ui][k]; return typeof v === 'function' ? v(...a) : v; };
const LN = l => TX[S.ui].LN[l];
const ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
let view = 'home', sess = null, arm = '';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pageLabel = p => p === 0 ? 'ZOUFFF!' : t('pg') + p;
const fmtDate = ts => new Date(ts).toLocaleDateString(S.ui === 'nl' ? 'nl-BE' : 'tr-TR', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'});
const $app = document.getElementById('app');

function pool() {
  return CARDS.filter(c =>
    (S.kind === 'all' || c.kind === S.kind) &&
    (!S.pages.length || S.pages.includes(c.page)) &&
    (!S.unknown || !known(c.id)));
}
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* ---------- spraak ---------- */
function speak(text, lang) {
  try {
    const u = new SpeechSynthesisUtterance(String(text).replace(/\(|\)/g, ''));
    u.lang = lang === 'fr' ? 'fr-FR' : lang === 'nl' ? 'nl-BE' : 'tr-TR';
    u.rate = 0.9; speechSynthesis.cancel(); speechSynthesis.speak(u);
  } catch (e) {}
}

/* ---------- antwoord controleren ---------- */
function expand(s) {
  const m = s.match(/\(([^)]*)\)/);
  if (!m) return [s];
  return [...expand(s.replace(m[0], '')), ...expand(s.replace(m[0], m[1]))];
}
function alts(card, lang) {
  const raw = card[lang];
  let parts = [raw];
  if (raw.includes(' / ')) parts = parts.concat(raw.split(' / '));
  if (card.kind === 'word' && raw.includes(', ')) parts = parts.concat(raw.split(', '));
  const out = [];
  parts.forEach(p => expand(p).forEach(x => out.push(x)));
  return out;
}
function norm(s) {
  return s.toLowerCase().replace(/[’‘`´]/g, "'").replace(/œ/g, 'oe')
    .replace(/[.,!?;:…"«»()→▸•]/g, ' ').replace(/\s+/g, ' ').trim();
}
const strip = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '');
function check(card, lang, input) {
  const a = norm(input);
  if (!a) return 'no';
  let accent = false;
  for (const alt of alts(card, lang)) {
    const b = norm(alt);
    if (a === b) return 'ok';
    if (strip(a) === strip(b)) accent = true;
  }
  return accent ? 'accent' : 'no';
}

/* ---------- oefensessie ---------- */
function newSess(q) { return {q, i:0, right:0, total:q.length, wrong:[], retried:{}, shown:false, hint:false, res:null, val:'', logged:false}; }
function start() {
  const p = pool();
  if (!p.length || !user()) return;
  sess = newSess(S.order === 'shuffle' ? shuffle(p) : p.slice());
  view = 'play'; render();
}
function finish() {
  view = 'done';
  const u = user();
  if (u && !sess.logged) {
    sess.logged = true;
    u.hist = (u.hist || []).concat({t: Date.now(), mode: S.mode, right: sess.right, total: sess.total}).slice(-60);
    save();
  }
}
function next() {
  sess.i++; sess.shown = false; sess.hint = false; sess.res = null; sess.val = '';
  if (sess.i >= sess.q.length) finish();
  render();
}
function mark(card, good) {
  const u = user(); if (!u) return;
  u.last = Date.now();
  if (good) {
    if (!sess.retried[card.id]) sess.right++;
    u.known[card.id] = 1;
    if (u.miss[card.id]) u.miss[card.id] = Math.max(0, u.miss[card.id] - 1);
  } else {
    u.miss[card.id] = (u.miss[card.id] || 0) + 1;
    delete u.known[card.id];
    if (!sess.wrong.includes(card)) sess.wrong.push(card);
    if (!sess.retried[card.id]) { sess.retried[card.id] = 1; sess.q.push(card); }
  }
  save();
}
function focusField() { const f = document.getElementById('ans'); if (f && !f.disabled) f.focus(); }

/* ---------- weergave ---------- */
const seg = (key, opts) => '<div class="seg">' + opts.map(([v, l]) =>
  `<button type="button" data-a="set" data-k="${key}" data-v="${v}" aria-pressed="${S[key] === v}">${l}</button>`).join('') + '</div>';
const tog = (key, label) => `<button type="button" class="tog" data-a="tog" data-k="${key}" aria-pressed="${!!S[key]}"><i></i><span>${label}</span></button>`;
const langSw = () => `<div class="lsw" role="group" aria-label="${t('lang')}">${['nl','tr'].map(l =>
  `<button type="button" data-a="ui" data-v="${l}" aria-pressed="${S.ui === l}">${l.toUpperCase()}</button>`).join('')}</div>`;

function usersView() {
  const list = store.users.map(u => {
    const k = Object.keys(u.known).length;
    return `<div class="urow"><button type="button" class="ubtn" data-a="pick" data-id="${u.id}"><b>${esc(u.name)}</b><span>${k} / ${CARDS.length} ${t('gekend')}</span></button>
      <button type="button" class="link" data-a="deluser" data-id="${u.id}">${arm === 'del' + u.id ? t('delSure') : t('del')}</button></div>`;
  }).join('');
  return `<header class="top"><div><h1>${t('who')}</h1><p>${t('whoD')}</p></div>${langSw()}</header>
  ${store.users.length ? `<div class="ulist">${list}</div>` : `<div class="empty">${t('empty')}</div>`}
  <form id="uf" class="sec" autocomplete="off"><h2>${t('add')}</h2>
    <div class="row"><input id="nm" class="field nm" type="text" maxlength="20" placeholder="${t('namePh')}" autocapitalize="words" autocorrect="off" spellcheck="false" enterkeyhint="done">
    <button type="submit" class="ghost">${t('addB')}</button></div></form>
  ${store.users.length ? `<div class="row"><button type="button" class="link" data-a="track">${t('progress')}</button>${user() ? `<button type="button" class="link" data-a="home">${t('back')}</button>` : ''}</div>` : ''}`;
}

function homeView() {
  const u = user();
  const pgs = [...new Set(CARDS.map(c => c.page))].sort((a, b) => a - b);
  const total = CARDS.length, k = CARDS.filter(c => known(c.id)).length, n = pool().length;
  const chips = pgs.map(p => {
    const items = CARDS.filter(c => c.page === p), kk = items.filter(c => known(c.id)).length;
    return `<button type="button" class="chip" data-a="page" data-v="${p}" aria-pressed="${S.pages.includes(p)}">${pageLabel(p)}<small>${kk}/${items.length}</small></button>`;
  }).join('');
  const dirs = S.mode === 'write'
    ? seg('dir', ['nl-fr','fr-nl','tr-fr','tr-nl'].map(d => [d, TX[S.ui].dirs[d]]))
    : seg('front', [['fr', t('frontFr')], ['nl', t('frontNl')]]) + tog('other', t('other'));
  return `
  <header class="top"><div><h1>${t('hi', esc(u.name))}</h1><p>Zouff! Mission 3 · ${t('sub')}</p></div>${langSw()}</header>
  <div class="who"><div class="sum">${k} / ${total} ${t('gekend')}</div>
    <div class="row"><button type="button" class="ghost" data-a="users">${t('switchKid')}</button><button type="button" class="ghost" data-a="track">${t('progress')}</button></div></div>
  <section class="sec"><h2>${t('what')}</h2>
    <div class="modes">
      <button type="button" class="mode" data-a="set" data-k="mode" data-v="card" aria-pressed="${S.mode === 'card'}"><b>${t('cardT')}</b><span>${t('cardD')}</span></button>
      <button type="button" class="mode" data-a="set" data-k="mode" data-v="write" aria-pressed="${S.mode === 'write'}"><b>${t('writeT')}</b><span>${t('writeD')}</span></button>
    </div></section>
  <section class="sec"><h2>${S.mode === 'write' ? t('dir') : t('face')}</h2>${dirs}
    ${S.mode === 'write' ? seg('accent', [['lenient', t('accL')], ['strict', t('accS')]]) : ''}</section>
  <section class="sec"><h2>${t('content')}</h2>${seg('kind', [['all', t('all')], ['word', t('words')], ['phrase', t('phrases')]])}</section>
  <section class="sec"><h2>${t('pages')}</h2><div class="seg">
    <button type="button" class="chip" data-a="page" data-v="all" aria-pressed="${!S.pages.length}">${t('allPages')}</button>${chips}</div></section>
  <section class="sec"><h2>${t('order')}</h2>${seg('order', [['seq', t('seq')], ['shuffle', t('shuf')]])}${tog('unknown', t('unk'))}</section>
  <button type="button" class="go" data-a="start" ${n ? '' : 'disabled'}>${n ? t('start', n, S.mode) : t('none')}</button>
  <div class="foot"><span>${t('foot')}</span>
    <button type="button" class="link" data-a="reset">${arm === 'reset' ? t('resetSure') : t('reset')}</button></div>`;
}

function trackView() {
  const pgs = [...new Set(CARDS.map(c => c.page))].sort((a, b) => a - b);
  const cards = store.users.map(u => {
    const k = Object.keys(u.known).length, pct = Math.round(k / CARDS.length * 100);
    const per = pgs.map(p => {
      const items = CARDS.filter(c => c.page === p), kk = items.filter(c => u.known[c.id]).length;
      return `<div class="pp"><span>${pageLabel(p)}</span><div class="prog"><i style="width:${Math.round(kk / items.length * 100)}%"></i></div><em>${kk}/${items.length}</em></div>`;
    }).join('');
    const hard = CARDS.filter(c => (u.miss[c.id] || 0) > 0).sort((a, b) => u.miss[b.id] - u.miss[a.id]).slice(0, 6);
    return `<section class="tc"><div class="tcH"><h3>${esc(u.name)}</h3><div class="score sm">${pct}%</div></div>
      <div class="prog big"><i style="width:${pct}%"></i></div>
      <div class="stats"><div><b>${k} / ${CARDS.length}</b><span>${t('gekend')}</span></div>
        <div><b>${(u.hist || []).length}</b><span>${t('sessions')}</span></div>
        <div><b>${u.last ? fmtDate(u.last) : '–'}</b><span>${u.last ? t('last') : t('never')}</span></div></div>
      <h2>${t('hardest')}</h2>
      ${hard.length ? `<ul class="list">${hard.map(c => `<li><b>${esc(c.fr)}</b><span>${esc(c.nl)} · ${esc(c.tr)} · ${t('times', u.miss[c.id])}</span></li>`).join('')}</ul>` : `<div class="empty">${t('noMiss')}</div>`}
      <h2>${t('perPage')}</h2><div class="pps">${per}</div></section>`;
  }).join('');
  return `<header class="top"><div><h1>${t('track')}</h1></div>${langSw()}</header>
  ${store.users.length ? cards : `<div class="empty">${t('empty')}</div>`}
  <button type="button" class="ghost" data-a="${user() ? 'home' : 'users'}">${t('back')}</button>`;
}

function barView() {
  const pct = Math.round(sess.i / sess.q.length * 100);
  return `<div class="bar"><button type="button" class="x" data-a="home" aria-label="${t('close')}">×</button>
    <div class="prog"><i style="width:${pct}%"></i></div><div class="cnt">${Math.min(sess.i + 1, sess.q.length)} / ${sess.q.length}</div></div>`;
}
const spk = (text, lang) => `<button type="button" class="spk" data-a="say" data-t="${esc(text)}" data-l="${lang}" aria-label="${t('listen')} (${LN(lang)})">${ICON}</button>`;

function cardView() {
  const c = sess.q[sess.i], f = S.front, o = f === 'fr' ? 'nl' : 'fr';
  const big = c[f].length > 28 ? 'mid' : 'big';
  return barView() + `
  <button type="button" class="flip ${sess.shown ? 'flipped' : ''}" data-a="flip" aria-label="${t('flipLabel')}">
    <span class="flipin">
      <span class="face" aria-hidden="${sess.shown}">
        <span class="prompt"><span class="lang ${f}">${LN(f).toUpperCase()}</span><span class="src">${esc(pageLabel(c.page))}</span></span>
        <span class="blk"><span class="w ${big} ${f}">${esc(c[f])}</span></span>
        ${S.other ? `<span class="blk"><span class="lang ${o}">${LN(o).toUpperCase()}</span><span class="w mid ${o}">${esc(c[o])}</span></span>` : ''}
        <span class="hint">${t('tapHint')}</span>
      </span>
      <span class="face back" aria-hidden="${!sess.shown}">
        <span class="prompt"><span class="lang tr">${t('turks')}</span><span class="src">${esc(pageLabel(c.page))}</span></span>
        <span class="blk"><span class="w ${c.tr.length > 28 ? 'mid' : 'big'} tr">${esc(c.tr)}</span></span>
        <span class="blk"><span class="src">${esc(c[f])}${S.other ? ' · ' + esc(c[o]) : ''}</span></span>
        <span class="hint">${t('backHint')}</span>
      </span>
    </span>
  </button>
  <div class="row">${spk(c[f], f)}${S.other ? spk(c[o], o) : ''}<span class="hint" style="margin-left:auto;text-align:right">${t('againHint')}</span></div>
  <div class="acts"><button type="button" class="no" data-a="again">${t('again')}</button><button type="button" class="yes" data-a="know">${t('know')}</button></div>`;
}

function writeView() {
  const c = sess.q[sess.i], [from, to] = S.dir.split('-');
  const big = c[from].length > 28 ? 'mid' : 'big', r = sess.res;
  const keys = to === 'fr' && !r ? `<div class="keys">${['é','è','ê','à','â','ç','ù','û','ô','î','ï','œ'].map(k => `<button type="button" data-a="key" data-v="${k}">${k}</button>`).join('')}</div>` : '';
  const good = r === 'ok' || (r === 'accent' && S.accent === 'lenient');
  let fb = '';
  if (r) {
    const cls = r === 'ok' ? 'ok' : good ? 'acc' : 'no';
    const head = r === 'ok' ? t('ok') : r === 'accent' ? (good ? t('near') : t('accErr')) : t('right');
    fb = `<div class="fb ${cls}"><b>${head}</b><div class="w mid ${to}">${esc(c[to])}</div><div class="src">${t('trLine')} ${esc(c.tr)}</div></div>`;
  }
  const cls = r ? (r === 'ok' ? 'ok' : good ? 'acc' : 'no') : '';
  return barView() + `
  <div class="card" style="min-height:0">
    <div class="prompt"><span class="lang ${from}">${LN(from).toUpperCase()}</span>${S.speak && from !== 'tr' ? spk(c[from], from) : '<span></span>'}</div>
    <div class="w ${big} ${from}">${esc(c[from])}</div>
    ${from !== 'tr' ? (sess.hint ? `<div class="src">${t('trLine')} ${esc(c.tr)}</div>` : `<button type="button" class="link" data-a="hint" style="align-self:flex-start">${t('hint')}</button>`) : ''}
  </div>
  <form id="f" autocomplete="off" class="sec">
    <label class="src" for="ans">${t('writeIn', LN(to))}</label>
    <input id="ans" class="field ${cls}" type="text" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false" enterkeyhint="done" value="${esc(sess.val)}" ${r ? 'disabled' : ''}>
    ${keys}${fb}
    ${r ? `<button type="button" class="go" data-a="next" id="nx">${t('next')}</button>` : `<button type="submit" class="go">${t('check')}</button>`}
    ${r ? '' : `<button type="button" class="link" data-a="skip" style="align-self:center">${t('skip')}</button>`}
  </form>`;
}

function doneView() {
  const w = sess.wrong;
  return `<header class="top"><div><h1>${t('done')}</h1><p>${t('first', sess.right, sess.total)}</p></div></header>
  <div class="score">${sess.right} / ${sess.total}</div>
  ${w.length ? `<section class="sec"><h2>${t('redo', w.length)}</h2><ul class="list">${w.map(c => `<li><b>${esc(c.fr)}</b><span>${esc(c.nl)} · ${esc(c.tr)}</span></li>`).join('')}</ul></section>` : `<div class="empty">${t('allOk')}</div>`}
  ${w.length ? `<button type="button" class="go" data-a="retry">${t('retry')}</button>` : ''}
  <button type="button" class="ghost" data-a="home">${t('homeB')}</button>`;
}

function render() {
  document.documentElement.lang = S.ui;
  if (view === 'home' && !user()) view = 'users';
  let h;
  if (view === 'users') h = usersView();
  else if (view === 'track') h = trackView();
  else if (view === 'done') h = doneView();
  else if (view === 'play') h = S.mode === 'card' ? cardView() : writeView();
  else h = homeView();
  $app.innerHTML = h;
  if (view === 'play' && S.mode === 'write') { focusField(); const nx = document.getElementById('nx'); if (nx) nx.focus(); }
}

/* ---------- gebeurtenissen ---------- */
document.addEventListener('pointerdown', e => {
  const k = e.target.closest('[data-a="key"]');
  if (!k) return;
  e.preventDefault();
  const f = document.getElementById('ans'); if (!f) return;
  const s = f.selectionStart ?? f.value.length, en = f.selectionEnd ?? s;
  f.value = f.value.slice(0, s) + k.dataset.v + f.value.slice(en);
  f.setSelectionRange(s + 1, s + 1); f.focus();
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'uf') {
    const name = document.getElementById('nm').value.trim().slice(0, 20);
    if (!name) return;
    const u = {id: 'u' + Date.now().toString(36), name, known: {}, miss: {}, hist: [], last: 0};
    if (store.legacy && !store.users.length) { u.known = store.legacy.known; u.miss = store.legacy.miss; store.legacy = null; }
    store.users.push(u); store.cur = u.id; view = 'home'; save(); render();
    return;
  }
  if (view !== 'play' || sess.res) return;
  const c = sess.q[sess.i], to = S.dir.split('-')[1];
  sess.val = document.getElementById('ans').value;
  const r = check(c, to, sess.val);
  sess.res = r;
  mark(c, r === 'ok' || (r === 'accent' && S.accent === 'lenient'));
  render();
});
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (!el || el.dataset.a === 'key') return;
  const a = el.dataset.a, d = el.dataset;
  const clearArm = () => { arm = ''; };
  if (a === 'set') { S[d.k] = d.v; save(); render(); }
  else if (a === 'tog') { S[d.k] = !S[d.k]; save(); render(); }
  else if (a === 'ui') { S.ui = d.v; save(); render(); }
  else if (a === 'page') {
    if (d.v === 'all') S.pages = []; else { const p = +d.v; S.pages = S.pages.includes(p) ? S.pages.filter(x => x !== p) : S.pages.concat(p); }
    save(); render();
  }
  else if (a === 'start') start();
  else if (a === 'home') { view = 'home'; sess = null; clearArm(); render(); }
  else if (a === 'users') { view = 'users'; sess = null; clearArm(); render(); }
  else if (a === 'track') { view = 'track'; clearArm(); render(); }
  else if (a === 'pick') { store.cur = d.id; view = 'home'; save(); clearArm(); render(); }
  else if (a === 'deluser') {
    if (arm !== 'del' + d.id) { arm = 'del' + d.id; render(); setTimeout(() => { if (arm === 'del' + d.id) { arm = ''; if (view === 'users') render(); } }, 4000); }
    else { store.users = store.users.filter(u => u.id !== d.id); if (store.cur === d.id) store.cur = null; arm = ''; save(); render(); }
  }
  else if (a === 'flip') { sess.shown = !sess.shown; el.classList.toggle('flipped', sess.shown); el.querySelectorAll('.face').forEach((f, i) => f.setAttribute('aria-hidden', String(i === 0 ? sess.shown : !sess.shown))); }
  else if (a === 'know') { mark(sess.q[sess.i], true); next(); }
  else if (a === 'again') { mark(sess.q[sess.i], false); next(); }
  else if (a === 'say') speak(d.t, d.l);
  else if (a === 'hint') { sess.val = (document.getElementById('ans') || {}).value || ''; sess.hint = true; render(); }
  else if (a === 'skip') { sess.val = (document.getElementById('ans') || {}).value || ''; sess.res = 'no'; mark(sess.q[sess.i], false); render(); }
  else if (a === 'next') next();
  else if (a === 'retry') { sess = newSess(sess.wrong.slice()); view = 'play'; render(); }
  else if (a === 'reset') {
    if (arm !== 'reset') { arm = 'reset'; render(); setTimeout(() => { if (arm === 'reset') { arm = ''; if (view === 'home') render(); } }, 4000); }
    else { const u = user(); if (u) { u.known = {}; u.miss = {}; u.hist = []; u.last = 0; } arm = ''; save(); render(); }
  }
});
render();
</script>
