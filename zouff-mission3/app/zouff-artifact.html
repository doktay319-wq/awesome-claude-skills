:root{

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.45;

#app{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--font-display);font-weight:600;margin:0;text-wrap:balance}
h1{font-size:2rem;line-height:1.1}
h2{font-size:1.05rem;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;font-family:var(--font-body);font-weight:800}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}

.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.top p{margin:4px 0 0;color:var(--muted)}
.sum{font-weight:800;color:var(--teal);font-variant-numeric:tabular-nums}
.sec{display:flex;flex-direction:column;gap:10px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.tog i{width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .15s}
.tog i::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);transition:transform .15s}
.tog[aria-pressed="true"] i{background:var(--teal)}

.cnt{font-variant-numeric:tabular-nums;font-weight:800;color:var(--muted);min-width:64px;text-align:right}
.card{background:var(--surface);border:2px solid var(--line);border-radius:26px;padding:26px 22px;min-height:300px;display:flex;flex-direction:column;gap:18px;justify-content:center;text-align:left;width:100%;box-shadow:0 2px 0 var(--line)}

.blk{display:flex;flex-direction:column;gap:6px}
.w{font-family:var(--font-display);font-weight:500;line-height:1.2;overflow-wrap:anywhere;text-wrap:balance}
.w.big{font-size:clamp(2rem,6.5vw,3rem)}.w.mid{font-size:clamp(1.4rem,4.5vw,1.9rem)}
.w.fr{color:var(--fr)}.w.nl{color:var(--nl)}.w.tr{color:var(--tr)}
.src{color:var(--muted);font-size:.9rem}
.hint{color:var(--muted);font-size:.95rem;text-align:center}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.acts button{min-height:64px;border-radius:18px;font-weight:800;font-size:1.1rem;border:2px solid var(--line);background:var(--surface)}
.acts .yes{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.acts .no{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.spk{width:48px;height:48px;border-radius:50%;border:2px solid var(--line);background:var(--surface);flex:none;display:inline-flex;align-items:center;justify-content:center}
.spk svg{width:22px;height:22px;fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.prompt{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.field{width:100%;font:inherit;font-family:var(--font-display);font-size:1.6rem;padding:16px 18px;border-radius:16px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.field[disabled]{opacity:.9}
.field.ok{border-color:var(--good);background:var(--good-soft)}.field.no{border-color:var(--bad);background:var(--bad-soft)}.field.acc{border-color:var(--nl);background:var(--warn-soft)}
.keys{display:flex;flex-wrap:wrap;gap:8px}
.keys button{min-width:46px;min-height:46px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-size:1.2rem;font-weight:600}
.fb{border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.fb.ok{background:var(--good-soft);color:var(--ink)}.fb.no{background:var(--bad-soft)}.fb.acc{background:var(--warn-soft)}
.fb b{font-family:var(--font-display);font-size:1.15rem;font-weight:600}
.score{font-family:var(--font-display);font-size:4rem;font-weight:600;color:var(--teal);line-height:1}
.list{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.list li{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}

.list span{color:var(--muted);font-size:.92rem}
.empty{background:var(--surface);border:2px dashed var(--line);border-radius:18px;padding:18px;color:var(--muted)}
.foot{color:var(--muted);font-size:.88rem;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
@media (max-width:480px){.modes{grid-template-columns:1fr}.card{min-height:260px;padding:20px 16px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

function norm(s) {
  return s.toLowerCase().replace(/[’‘`´]/g, "'").replace(/œ/g, 'oe')
    .replace(/[.,!?;:…"«»()→▸•]/g, ' ').replace(/\s+/g, ' ').trim();
}
const strip = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '');
function check(card, lang, input) {
  const a = norm(input);
  if (!a) return 'no';
  let accent = false;
  for (const alt of alts(card, lang)) {
    const b = norm(alt);
    if (a === b) return 'ok';
    if (strip(a) === strip(b)) accent = true;
  }
  return accent ? 'accent' : 'no';
}

/* ---------- session ---------- */
function start() {
  const p = pool();
  if (!p.length) return;
  const q = S.order === 'shuffle' ? shuffle(p) : p.slice();
  sess = {q, i:0, right:0, total:q.length, wrong:[], retried:{}, shown:false, hint:false, res:null, val:''};
  view = 'play'; render();
}
function next() {
  sess.i++; sess.shown = false; sess.hint = false; sess.res = null; sess.val = '';
  if (sess.i >= sess.q.length) view = 'done';
  render();
  focusField();
}
function mark(card, good) {
  if (good) { if (!sess.retried[card.id]) sess.right++; store.known[card.id] = 1; if (store.miss[card.id]) store.miss[card.id] = Math.max(0, store.miss[card.id] - 1); }
  else {
    store.miss[card.id] = (store.miss[card.id] || 0) + 1;
    delete store.known[card.id];
    if (!sess.wrong.includes(card)) sess.wrong.push(card);
    if (!sess.retried[card.id]) { sess.retried[card.id] = 1; sess.q.push(card); }
  }
  save();
}
function focusField() { const f = document.getElementById('ans'); if (f && !f.disabled) f.focus(); }

/* ---------- views ---------- */
function seg(key, opts) {
  return '<div class="seg">' + opts.map(([v, l]) =>
    `<button type="button" data-a="set" data-k="${key}" data-v="${v}" aria-pressed="${S[key] === v}">${l}</button>`).join('') + '</div>';
}
function tog(key, label) {
  return `<button type="button" class="tog" data-a="tog" data-k="${key}" aria-pressed="${!!S[key]}"><i></i><span>${label}</span></button>`;
}
function homeView() {
  const pgs = [...new Set(CARDS.map(c => c.page))].sort((a, b) => a - b);
  const total = CARDS.length, known = CARDS.filter(c => store.known[c.id]).length;
  const n = pool().length;
  const chips = pgs.map(p => {
    const items = CARDS.filter(c => c.page === p), k = items.filter(c => store.known[c.id]).length;
    return `<button type="button" class="chip" data-a="page" data-v="${p}" aria-pressed="${S.pages.includes(p)}">${pageLabel(p)}<small>${k}/${items.length}</small></button>`;
  }).join('');
  const dirs = S.mode === 'write'
    ? seg('dir', [['nl-fr','Felemenkçe → Fransızca'],['fr-nl','Fransızca → Felemenkçe'],['tr-fr','Türkçe → Fransızca'],['tr-nl','Türkçe → Felemenkçe']])
    : seg('front', [['fr','Önde Fransızca'],['nl','Önde Felemenkçe']]) + tog('other', 'Diğer dili de göster (Fransızca + Felemenkçe yan yana)');
  return `
  <header class="top"><div><h1>Zouff! Mission 3</h1><p>Tu fais quoi? · sayfa 25–42</p></div><div class="sum">${known} / ${total} biliyorum</div></header>
  <section class="sec"><h2>Ne yapalım?</h2>
    <div class="modes">
      <button type="button" class="mode" data-a="set" data-k="mode" data-v="card" aria-pressed="${S.mode === 'card'}"><b>Kart</b><span>Kelimeye bak, karta dokun, Türkçesini gör.</span></button>
      <button type="button" class="mode" data-a="set" data-k="mode" data-v="write" aria-pressed="${S.mode === 'write'}"><b>Yazma</b><span>Kelimeyi gör, karşılığını yaz.</span></button>
    </div></section>
  <section class="sec"><h2>${S.mode === 'write' ? 'Yön' : 'Kart yüzü'}</h2>${dirs}
    ${S.mode === 'write' ? seg('accent', [['lenient','Aksan hatası kabul (uyarılı)'],['strict','Aksan hatası yanlış']]) : ''}</section>
  <section class="sec"><h2>İçerik</h2>${seg('kind', [['all','Hepsi'],['word','Kelimeler'],['phrase','Cümleler']])}</section>
  <section class="sec"><h2>Sayfalar</h2><div class="seg">
    <button type="button" class="chip" data-a="page" data-v="all" aria-pressed="${!S.pages.length}">Tüm sayfalar</button>${chips}</div></section>
  <section class="sec"><h2>Sıra</h2>${seg('order', [['seq','Sayfa sırası'],['shuffle','Karışık']])}
    ${tog('unknown', 'Sadece bilmediklerim')}</section>
  <button type="button" class="go" data-a="start" ${n ? '' : 'disabled'}>${n ? `Başla · ${n} ${S.mode === 'card' ? 'kart' : 'soru'}` : 'Bu seçimde kart yok'}</button>
  <div class="foot"><span>İlerleme bu iPad'in tarayıcısında saklanır.</span>
    <button type="button" class="link" data-a="reset">${resetArm ? 'Emin misin? Tekrar dokun' : 'İlerlemeyi sıfırla'}</button></div>`;
}
function barView() {
  const pct = Math.round(sess.i / sess.q.length * 100);
  return `<div class="bar"><button type="button" class="x" data-a="home" aria-label="Çık">×</button>
    <div class="prog"><i style="width:${pct}%"></i></div><div class="cnt">${Math.min(sess.i + 1, sess.q.length)} / ${sess.q.length}</div></div>`;
}
function spk(text, lang) { return `<button type="button" class="spk" data-a="say" data-t="${esc(text)}" data-l="${lang}" aria-label="Dinle">${ICON}</button>`; }
function cardView() {
  const c = sess.q[sess.i], f = S.front, o = f === 'fr' ? 'nl' : 'fr';
  const big = c[f].length > 28 ? 'mid' : 'big';
  return barView() + `
  <button type="button" class="card" data-a="flip" aria-label="Karta dokun: Türkçe çeviri">
    <div class="prompt"><span class="lang ${f}">${LN[f].toUpperCase()}</span><span class="src">${esc(pageLabel(c.page))}</span></div>
    <div class="blk"><div class="w ${big} ${f}">${esc(c[f])}</div></div>
    ${S.other ? `<div class="blk"><span class="lang ${o}">${LN[o].toUpperCase()}</span><div class="w mid ${o}">${esc(c[o])}</div></div>` : ''}
    ${sess.shown ? `<div class="blk"><span class="lang tr">TÜRKÇE</span><div class="w mid tr">${esc(c.tr)}</div></div>` : `<div class="hint">Dokun: Türkçesini göster</div>`}
  </button>
  <div class="row">${spk(c[f], f)}${S.other ? spk(c[o], o) : ''}<span class="hint" style="margin-left:auto">Bilmiyorsan "Tekrar" de, kart sona eklenir.</span></div>
  <div class="acts"><button type="button" class="no" data-a="again">Tekrar ↻</button><button type="button" class="yes" data-a="know">Biliyorum ✓</button></div>`;
}
function writeView() {
  const c = sess.q[sess.i], [from, to] = S.dir.split('-');
  const big = c[from].length > 28 ? 'mid' : 'big';
  const r = sess.res;
  const keys = to === 'fr' && !r ? `<div class="keys">${['é','è','ê','à','â','ç','ù','û','ô','î','ï','œ'].map(k => `<button type="button" data-a="key" data-v="${k}">${k}</button>`).join('')}</div>` : '';
  let fb = '';
  if (r) {
    const cls = r === 'ok' || (r === 'accent' && S.accent === 'lenient') ? (r === 'ok' ? 'ok' : 'acc') : 'no';
    const head = r === 'ok' ? 'Doğru!' : r === 'accent' ? (S.accent === 'lenient' ? 'Neredeyse: aksanlara dikkat' : 'Aksan hatası') : 'Doğrusu:';
    fb = `<div class="fb ${cls}"><b>${head}</b><div class="w mid ${to}">${esc(c[to])}</div><div class="src">Türkçe: ${esc(c.tr)}</div></div>`;
  }
  const cls = r ? (r === 'ok' ? 'ok' : r === 'accent' && S.accent === 'lenient' ? 'acc' : 'no') : '';
  return barView() + `
  <div class="card" style="min-height:0">
    <div class="prompt"><span class="lang ${from}">${LN[from].toUpperCase()}</span>${S.speak && from !== 'tr' ? spk(c[from], from) : '<span></span>'}</div>
    <div class="w ${big} ${from}">${esc(c[from])}</div>
    ${from !== 'tr' ? (sess.hint ? `<div class="src">Türkçe: ${esc(c.tr)}</div>` : `<button type="button" class="link" data-a="hint" style="align-self:flex-start">Türkçe ipucu</button>`) : ''}
  </div>
  <form id="f" autocomplete="off" class="sec">
    <label class="src" for="ans">${LN[to]} yaz</label>
    <input id="ans" class="field ${cls}" type="text" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false" enterkeyhint="done" value="${esc(sess.val)}" ${r ? 'disabled' : ''}>
    ${keys}${fb}
    ${r ? `<button type="button" class="go" data-a="next" id="nx">Sonraki</button>` : `<button type="submit" class="go">Kontrol et</button>`}
    ${r ? '' : `<button type="button" class="link" data-a="skip" style="align-self:center">Bilmiyorum, cevabı göster</button>`}
  </form>`;
}
function doneView() {
  const w = sess.wrong;
  return `<header class="top"><div><h1>Bitti!</h1><p>İlk denemede doğru: ${sess.right} / ${sess.total}</p></div></header>
  <div class="score">${sess.right} / ${sess.total}</div>
  ${w.length ? `<section class="sec"><h2>Tekrar edilecekler (${w.length})</h2><ul class="list">${w.map(c => `<li><b>${esc(c.fr)}</b><span>${esc(c.nl)} · ${esc(c.tr)}</span></li>`).join('')}</ul></section>` : '<div class="empty">Hepsini bildin. Harika!</div>'}
  ${w.length ? `<button type="button" class="go" data-a="retry">Hataları tekrar çalış</button>` : ''}
  <button type="button" class="ghost" data-a="home">Ana ekran</button>`;
}
function render() {
  $app.innerHTML = view === 'home' ? homeView() : view === 'done' ? doneView() : (S.mode === 'card' ? cardView() : writeView());
  if (view === 'play' && S.mode === 'write') { focusField(); const nx = document.getElementById('nx'); if (nx) nx.focus(); }
}

/* ---------- events ---------- */
document.addEventListener('pointerdown', e => {
  const k = e.target.closest('[data-a="key"]');
  if (k) { e.preventDefault(); const f = document.getElementById('ans'); if (!f) return;
    const s = f.selectionStart ?? f.value.length, t = f.selectionEnd ?? s;
    f.value = f.value.slice(0, s) + k.dataset.v + f.value.slice(t); f.setSelectionRange(s + 1, s + 1); f.focus(); }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (view !== 'play' || sess.res) return;
  const c = sess.q[sess.i], to = S.dir.split('-')[1];
  const input = document.getElementById('ans').value;
  sess.val = input;
  const r = check(c, to, input);
  sess.res = r;
  mark(c, r === 'ok' || (r === 'accent' && S.accent === 'lenient'));
  render();
});
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (!el || el.dataset.a === 'key') return;
  const a = el.dataset.a;
  if (a === 'set') { S[el.dataset.k] = el.dataset.v; save(); render(); }
  else if (a === 'tog') { S[el.dataset.k] = !S[el.dataset.k]; save(); render(); }
  else if (a === 'page') {
    const v = el.dataset.v;
    if (v === 'all') S.pages = []; else { const p = +v; S.pages = S.pages.includes(p) ? S.pages.filter(x => x !== p) : S.pages.concat(p); }
    save(); render();
  }
  else if (a === 'start') start();
  else if (a === 'home') { view = 'home'; sess = null; resetArm = false; render(); }
  else if (a === 'flip') { sess.shown = !sess.shown; render(); }
  else if (a === 'know') { mark(sess.q[sess.i], true); next(); }
  else if (a === 'again') { mark(sess.q[sess.i], false); next(); }
  else if (a === 'say') speak(el.dataset.t, el.dataset.l);
  else if (a === 'hint') { sess.hint = true; sess.val = (document.getElementById('ans') || {}).value || ''; render(); }
  else if (a === 'skip') { sess.val = (document.getElementById('ans') || {}).value || ''; sess.res = 'no'; mark(sess.q[sess.i], false); render(); }
  else if (a === 'next') next();
  else if (a === 'retry') { const q = sess.wrong.slice(); sess = {q, i:0, right:0, total:q.length, wrong:[], retried:{}, shown:false, hint:false, res:null, val:''}; view = 'play'; render(); }
  else if (a === 'reset') {
    if (!resetArm) { resetArm = true; render(); setTimeout(() => { resetArm = false; if (view === 'home') render(); }, 4000); }
    else { store.known = {}; store.miss = {}; resetArm = false; save(); render(); }
  }
});
render();
</script>
