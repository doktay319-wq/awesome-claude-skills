<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Zouff"><meta name="theme-color" content="#0E8A8C">
<title>Zouff Mission 3</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;800&display=swap">
<style>
/* Layout: one centered column (max 720px) tuned for iPad; setup screen, then a full-width card or typing screen. */
:root{
  --bg:#EDF4F4; --surface:#FFFFFF; --ink:#14323A; --muted:#58757D; --line:#CCDFE1;
  --teal:#0E8A8C; --teal-ink:#FFFFFF; --teal-soft:#D6EEEE;
  --nl:#B8650A; --nl-soft:#FBEBD0; --fr:#5E3F96; --fr-soft:#E8E0F5; --tr:#0E6E70; --tr-soft:#D6EEEE;
  --good:#1B8A4C; --good-soft:#D9F2E3; --bad:#C23A3A; --bad-soft:#F8DEDE; --warn-soft:#FCF0C8;
  --font-display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1C20; --surface:#16282D; --ink:#E7F1F2; --muted:#8FAAB1; --line:#29444B;
    --teal:#3DC0C2; --teal-ink:#06292A; --teal-soft:#17393C;
    --nl:#F1B45E; --nl-soft:#3A2D18; --fr:#BCA3EA; --fr-soft:#2C2342; --tr:#6FD0D2; --tr-soft:#17393C;
    --good:#58CF8C; --good-soft:#15362A; --bad:#F28383; --bad-soft:#3E1F22; --warn-soft:#3B3318;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1C20; --surface:#16282D; --ink:#E7F1F2; --muted:#8FAAB1; --line:#29444B;
  --teal:#3DC0C2; --teal-ink:#06292A; --teal-soft:#17393C;
  --nl:#F1B45E; --nl-soft:#3A2D18; --fr:#BCA3EA; --fr-soft:#2C2342; --tr:#6FD0D2; --tr-soft:#17393C;
  --good:#58CF8C; --good-soft:#15362A; --bad:#F28383; --bad-soft:#3E1F22; --warn-soft:#3B3318;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.45;
  padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
#app{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--font-display);font-weight:600;margin:0;text-wrap:balance}
h1{font-size:2rem;line-height:1.1}
h2{font-size:1.05rem;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;font-family:var(--font-body);font-weight:800}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.top p{margin:4px 0 0;color:var(--muted)}
.sum{font-weight:800;color:var(--teal);font-variant-numeric:tabular-nums}
.sec{display:flex;flex-direction:column;gap:10px}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.mode{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:18px;text-align:left;min-height:96px;display:flex;flex-direction:column;gap:4px}
.mode b{font-family:var(--font-display);font-size:1.4rem;font-weight:600}
.mode span{color:var(--muted);font-size:.95rem}
.mode[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-soft)}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button,.chip{background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:10px 16px;min-height:44px;font-weight:600}
.seg button[aria-pressed="true"],.chip[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:var(--teal-ink)}
.chip small{opacity:.75;font-variant-numeric:tabular-nums;margin-left:6px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.tog{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:600;text-align:left}
.tog i{width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .15s}
.tog i::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);transition:transform .15s}
.tog[aria-pressed="true"] i{background:var(--teal)}
.tog[aria-pressed="true"] i::after{transform:translateX(18px)}
.go{background:var(--teal);color:var(--teal-ink);border-radius:18px;min-height:60px;padding:14px 22px;font-family:var(--font-display);font-size:1.3rem;font-weight:600;width:100%}
.go[disabled]{opacity:.45;cursor:not-allowed}
.ghost{border:2px solid var(--line);border-radius:14px;padding:10px 16px;min-height:44px;font-weight:600;background:var(--surface)}
.link{color:var(--muted);text-decoration:underline;min-height:44px;padding:0 4px}
.bar{display:flex;align-items:center;gap:14px}
.bar .x{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--surface);font-size:1.3rem;line-height:1}
.prog{flex:1;height:10px;border-radius:999px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--teal);border-radius:999px;transition:width .25s}
.cnt{font-variant-numeric:tabular-nums;font-weight:800;color:var(--muted);min-width:64px;text-align:right}
.card{background:var(--surface);border:2px solid var(--line);border-radius:26px;padding:26px 22px;min-height:300px;display:flex;flex-direction:column;gap:18px;justify-content:center;text-align:left;width:100%;box-shadow:0 2px 0 var(--line)}
.lang{display:inline-block;font-size:.78rem;font-weight:800;letter-spacing:.08em;padding:3px 10px;border-radius:999px;align-self:flex-start}
.lang.fr{background:var(--fr-soft);color:var(--fr)}.lang.nl{background:var(--nl-soft);color:var(--nl)}.lang.tr{background:var(--tr-soft);color:var(--tr)}
.blk{display:flex;flex-direction:column;gap:6px}
.w{font-family:var(--font-display);font-weight:500;line-height:1.2;overflow-wrap:anywhere;text-wrap:balance}
.w.big{font-size:clamp(2rem,6.5vw,3rem)}.w.mid{font-size:clamp(1.4rem,4.5vw,1.9rem)}
.w.fr{color:var(--fr)}.w.nl{color:var(--nl)}.w.tr{color:var(--tr)}
.src{color:var(--muted);font-size:.9rem}
.hint{color:var(--muted);font-size:.95rem;text-align:center}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.acts button{min-height:64px;border-radius:18px;font-weight:800;font-size:1.1rem;border:2px solid var(--line);background:var(--surface)}
.acts .yes{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.acts .no{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.spk{width:48px;height:48px;border-radius:50%;border:2px solid var(--line);background:var(--surface);flex:none;display:inline-flex;align-items:center;justify-content:center}
.spk svg{width:22px;height:22px;fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.prompt{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.field{width:100%;font:inherit;font-family:var(--font-display);font-size:1.6rem;padding:16px 18px;border-radius:16px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.field[disabled]{opacity:.9}
.field.ok{border-color:var(--good);background:var(--good-soft)}.field.no{border-color:var(--bad);background:var(--bad-soft)}.field.acc{border-color:var(--nl);background:var(--warn-soft)}
.keys{display:flex;flex-wrap:wrap;gap:8px}
.keys button{min-width:46px;min-height:46px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-size:1.2rem;font-weight:600}
.fb{border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.fb.ok{background:var(--good-soft);color:var(--ink)}.fb.no{background:var(--bad-soft)}.fb.acc{background:var(--warn-soft)}
.fb b{font-family:var(--font-display);font-size:1.15rem;font-weight:600}
.score{font-family:var(--font-display);font-size:4rem;font-weight:600;color:var(--teal);line-height:1}
.list{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.list li{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.list b{font-family:var(--font-display);font-weight:500;font-size:1.1rem}
.list span{color:var(--muted);font-size:.92rem}
.empty{background:var(--surface);border:2px dashed var(--line);border-radius:18px;padding:18px;color:var(--muted)}
.foot{color:var(--muted);font-size:.88rem;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* flip card */
.flip{display:block;width:100%;perspective:1400px;text-align:left}
.flipin{display:grid;position:relative;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,.7,.2,1)}
.flip.flipped .flipin{transform:rotateY(180deg)}
.face{grid-area:1/1;display:flex;flex-direction:column;gap:18px;justify-content:center;min-height:330px;padding:26px 22px;background:var(--surface);border:2px solid var(--line);border-radius:26px;box-shadow:0 2px 0 var(--line);backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.back{transform:rotateY(180deg);background:var(--tr-soft);border-color:var(--tr)}
.face .prompt{display:flex;align-items:center;justify-content:space-between;gap:12px}
.face .blk{display:flex;flex-direction:column;gap:6px}
.trbox{display:flex;flex-direction:column;gap:6px;padding:16px 18px;border-radius:18px;background:var(--tr-soft);border:2px solid var(--tr)}
.trb[aria-pressed="true"]{background:var(--tr-soft);border-color:var(--tr);color:var(--tr)}

/* pin pad + fill-in */
.dots{display:flex;justify-content:center;gap:18px;margin-top:6px}
.dots i{width:22px;height:22px;border-radius:50%;border:3px solid var(--teal);background:transparent;transition:background .1s,transform .1s}
.dots i.on{background:var(--teal);transform:scale(1.1)}
.dots.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}
.perr{text-align:center;color:var(--bad);font-weight:800;min-height:1.5em}
.kp{display:grid;grid-template-columns:repeat(3,84px);gap:14px;justify-content:center}
.kp button{height:84px;border-radius:50%;background:var(--surface);border:2px solid var(--line);font-family:var(--font-display);font-size:2rem;font-weight:600}
.kp button:active{background:var(--teal);color:var(--teal-ink);border-color:var(--teal)}
.instr{font-weight:800;font-size:1.05rem;line-height:1.35}
.instr small{display:block;color:var(--muted);font-weight:600;font-size:.88rem}
.sent{margin:0;font-family:var(--font-display);font-size:clamp(1.3rem,4.4vw,1.8rem);line-height:2.1;overflow-wrap:anywhere}
.blank{font:inherit;font-family:var(--font-display);font-size:inherit;color:var(--fr);background:var(--bg);border:0;border-bottom:3px solid var(--teal);border-radius:8px 8px 0 0;padding:2px 8px;margin:0 4px;text-align:center;min-width:3.2ch;max-width:100%}
.blank.ok{border-color:var(--good);background:var(--good-soft)}.blank.no{border-color:var(--bad);background:var(--bad-soft)}.blank.acc{border-color:var(--nl);background:var(--warn-soft)}
@media (prefers-reduced-motion:reduce){.dots.shake{animation:none}}
.ubar{display:flex;align-items:center;gap:10px;margin-top:6px}
.ubar .prog{flex:1;height:8px}
.ubar em{font-style:normal;font-weight:800;color:var(--teal);font-variant-numeric:tabular-nums}
.syncl{font-size:.88rem;color:var(--muted)}
.syncl.readonly,.syncl.error{color:var(--bad);font-weight:700}
/* profiles + tracking */
.lsw{display:inline-flex;border:2px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.lsw button{padding:8px 14px;min-height:40px;font-weight:800;font-size:.85rem;letter-spacing:.06em}
.lsw button[aria-pressed="true"]{background:var(--teal);color:var(--teal-ink)}
.who{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ulist{display:flex;flex-direction:column;gap:12px}
.urow{display:flex;align-items:center;gap:12px}
.ubtn{flex:1;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:16px 18px;text-align:left;min-height:72px;display:flex;flex-direction:column;gap:2px}
.ubtn b{font-family:var(--font-display);font-size:1.5rem;font-weight:600}
.ubtn span{color:var(--muted);font-size:.92rem;font-variant-numeric:tabular-nums}
.field.nm{flex:1;min-width:0;font-size:1.2rem;padding:12px 16px}
.tc{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:14px}
.tcH{display:flex;align-items:center;justify-content:space-between;gap:12px}
.tcH h3{font-size:1.6rem}
.score.sm{font-size:2rem}
.prog.big{height:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.stats div{display:flex;flex-direction:column;gap:2px;min-width:0}
.stats b{font-family:var(--font-display);font-weight:600;font-size:1.15rem;font-variant-numeric:tabular-nums}
.stats span{color:var(--muted);font-size:.85rem}
.pps{display:flex;flex-direction:column;gap:8px}
.pp{display:grid;grid-template-columns:72px 1fr 54px;gap:10px;align-items:center;font-size:.92rem}
.pp em{font-style:normal;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:640px){.modes{grid-template-columns:1fr}}
@media (max-width:480px){.card{min-height:260px;padding:20px 16px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

function pool() {
  const k = pagesKey();
  return source().filter(c =>
    (isFill() || S.kind === 'all' || c.kind === S.kind) &&
    (!S[k].length || S[k].includes(c.page)) &&
    (!S.unknown || !known(c.id)));
}
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function speak(text, lang) {
  try {
    const u = new SpeechSynthesisUtterance(String(text).replace(/\(|\)/g, ''));
    u.lang = lang === 'fr' ? 'fr-FR' : lang === 'nl' ? 'nl-BE' : 'tr-TR';
    u.rate = 0.9; speechSynthesis.cancel(); speechSynthesis.speak(u);
  } catch (e) {}
}

/* ---------- antwoord controleren ---------- */
function expand(s) {
  const m = s.match(/\(([^)]*)\)/);
  if (!m) return [s];
  return [...expand(s.replace(m[0], '')), ...expand(s.replace(m[0], m[1]))];
}
function alts(card, lang) {
  const raw = card[lang];
  let parts = [raw];
  if (raw.includes(' / ')) parts = parts.concat(raw.split(' / '));
  if (card.kind === 'word' && raw.includes(', ')) parts = parts.concat(raw.split(', '));
  const out = [];
  parts.forEach(p => expand(p).forEach(x => out.push(x)));
  return out;
}
function norm(s) {
  return s.toLowerCase().replace(/[’‘`´]/g, "'").replace(/œ/g, 'oe')
    .replace(/[.,!?;:…"«»()→▸•]/g, ' ').replace(/\s+/g, ' ').trim();
}
const strip = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '');
function matchAny(list, input) {
  const a = norm(input);
  if (!a) return 'no';
  let accent = false;
  for (const alt of list) {
    const b = norm(alt);
    if (a === b) return 'ok';
    if (strip(a) === strip(b)) accent = true;
  }
  return accent ? 'accent' : 'no';
}
const check = (card, lang, input) => matchAny(alts(card, lang), input);

function newSess(q) { return {q, i:0, right:0, total:q.length, wrong:[], retried:{}, shown:false, trShow:false, hint:false, res:null, val:'', vals:[], arr:null, logged:false}; }
function start() {

}
function finish() {
  view = 'done';

  if (u && !sess.logged) {
    sess.logged = true;
    u.hist = (u.hist || []).concat({t: Date.now(), mode: S.mode, right: sess.right, total: sess.total}).slice(-60);
    saveProgress();
  }
}
function next() {
  sess.i++; sess.shown = false; sess.trShow = false; sess.hint = false; sess.res = null; sess.val = ''; sess.vals = []; sess.arr = null;
  if (sess.i >= sess.q.length) finish();

}
function mark(card, good) {
  const u = user(); if (!u) return;
  u.last = Date.now();
  if (good) {
    if (!sess.retried[card.id]) sess.right++;
    u.known[card.id] = 1;
    if (u.miss[card.id]) u.miss[card.id] = Math.max(0, u.miss[card.id] - 1);
  } else {
    u.miss[card.id] = (u.miss[card.id] || 0) + 1;
    delete u.known[card.id];
    if (!sess.wrong.includes(card)) sess.wrong.push(card);
    if (!sess.retried[card.id]) { sess.retried[card.id] = 1; sess.q.push(card); }
  }
  saveProgress();
}

    const cls = r === 'ok' ? 'ok' : good ? 'acc' : 'no';
    const head = r === 'ok' ? t('ok') : r === 'accent' ? (good ? t('near') : t('accErr')) : t('right');
    fb = `<div class="fb ${cls}"><b>${head}</b>${r === 'ok' ? '' : `<div class="w mid fr">${esc(filled(c))}</div>`}</div>`;
  }
  return barView() + `
  <form id="f" autocomplete="off" class="sec">
  <div class="card" style="min-height:0">
    <div class="prompt"><span class="lang fr">${t('fillIn').toUpperCase()}</span><span class="src">${esc(pageLabel(c.page))} · ${esc(c.ex)}</span></div>
    <div class="instr">${esc(c.instr)}<small>${esc(c.instr_nl)}</small></div>
    ${c.hint ? `<div class="src">${esc(c.hint)}</div>` : ''}
    <p class="sent">${body}</p>
  </div>
    ${r ? '' : KEYS()}${fb}
    ${r ? `<button type="button" class="go" data-a="next" id="nx">${t('next')}</button>` : `<button type="submit" class="go">${t('check')}</button>`}
    ${r ? '' : `<button type="button" class="link" data-a="skip" style="align-self:center">${t('skip')}</button>`}
  </form>`;
}

function doneView() {
  const w = sess.wrong;
  return `<header class="top"><div><h1>${t('done')}</h1><p>${t('first', sess.right, sess.total)}</p></div></header>
  <div class="score">${sess.right} / ${sess.total}</div>
  ${w.length ? `<section class="sec"><h2>${t('redo', w.length)}</h2><ul class="list">${w.map(c => `<li><b>${esc(lab(c))}</b>${subl(c) ? `<span>${esc(subl(c))}</span>` : ''}</li>`).join('')}</ul></section>` : `<div class="empty">${t('allOk')}</div>`}
  ${w.length ? `<button type="button" class="go" data-a="retry">${t('retry')}</button>` : ''}
  <button type="button" class="ghost" data-a="home">${t('homeB')}</button>`;
}

function render() {
  document.documentElement.lang = S.ui;
  if (!user() && ['home', 'play', 'done'].includes(view)) view = 'users';
  let h;
  if (view === 'pin' && pin) h = pinView();
  else if (view === 'users') h = usersView();
  else if (view === 'track') h = trackView();
  else if (view === 'done') h = doneView();
  else if (view === 'play') h = S.mode === 'card' ? cardView() : S.mode === 'fill' ? fillView() : writeView();
  else h = homeView();
  $app.innerHTML = h;
  if (view === 'play' && S.mode !== 'card') { focusField(); const nx = document.getElementById('nx'); if (nx) nx.focus(); }
}

/* ---------- gebeurtenissen ---------- */
document.addEventListener('pointerdown', e => {
  const k = e.target.closest('[data-a="key"]');
  if (!k) return;
  e.preventDefault();
  const ae = document.activeElement;
  const f = ae && ae.tagName === 'INPUT' && !ae.disabled ? ae : (document.querySelector('.blank:not([disabled])') || document.getElementById('ans'));
  if (!f) return;
  const s = f.selectionStart ?? f.value.length, en = f.selectionEnd ?? s;
  f.value = f.value.slice(0, s) + k.dataset.v + f.value.slice(en);
  f.setSelectionRange(s + 1, s + 1); f.focus();
});
document.addEventListener('input', e => { if (e.target && e.target.id === 'nm') nameDraft = e.target.value; });
document.addEventListener('keydown', e => {
  if (view === 'pin' && pin && !(e.target && e.target.tagName === 'INPUT')) {
    if (/^[0-9]$/.test(e.key)) pinPress(e.key);
    else if (e.key === 'Backspace') pinPress('⌫');
  } else if (e.key === 'Enter' && e.target && e.target.classList && e.target.classList.contains('blank')) {
    const nxt = document.getElementById('b' + (+e.target.dataset.i + 1));
    if (nxt) { e.preventDefault(); nxt.focus(); }
  }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'uf') {
    const name = document.getElementById('nm').value.trim().slice(0, 20);
    if (name) newKid(name);
    return;
  }
  if (view !== 'play' || sess.res) return;
  const c = sess.q[sess.i];
  if (S.mode === 'fill') {
    const vals = [...document.querySelectorAll('.blank')].map(x => x.value);
    sess.vals = vals;
    sess.arr = c.answers.map((a, i) => matchAny(a.split('|').flatMap(expand), vals[i] || ''));
    sess.res = sess.arr.every(x => x === 'ok') ? 'ok' : sess.arr.every(x => x !== 'no') ? 'accent' : 'no';
  } else {
    sess.val = document.getElementById('ans').value;
    sess.res = check(c, S.dir.split('-')[1], sess.val);
  }
  mark(c, sess.res === 'ok' || (sess.res === 'accent' && S.accent === 'lenient'));
  render();
});
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (!el || el.dataset.a === 'key') return;
  const a = el.dataset.a, d = el.dataset;
  if (a === 'set') { S[d.k] = d.v; save(); render(); }
  else if (a === 'tog') { S[d.k] = !S[d.k]; save(); render(); }
  else if (a === 'ui') { S.ui = d.v; save(); render(); }
  else if (a === 'page') {
    const k = pagesKey();
    if (d.v === 'all') S[k] = []; else { const p = +d.v; S[k] = S[k].includes(p) ? S[k].filter(x => x !== p) : S[k].concat(p); }
    save(); render();
  }
  else if (a === 'start') start();
  else if (a === 'home') { view = 'home'; sess = null; arm = ''; render(); }
  else if (a === 'users') { store.cur = null; view = 'users'; sess = null; arm = ''; render(); }
  else if (a === 'track') openTrack();
  else if (a === 'pick') pickKid(d.id);
  else if (a === 'deluser') delKid(d.id);
  else if (a === 'parent') setParent();
  else if (a === 'pk') pinPress(d.v);
  else if (a === 'pincancel') { const b = pin ? pin.back : 'users'; pin = null; view = b === 'home' && !user() ? 'users' : b; render(); }
  else if (a === 'forgot') { if (pin && pin.forgot) pin.forgot(); }
  else if (a === 'flip') { sess.shown = !sess.shown; el.classList.toggle('flipped', sess.shown); el.querySelectorAll('.face').forEach((f, i) => f.setAttribute('aria-hidden', String(i === 0 ? sess.shown : !sess.shown))); }
  else if (a === 'trshow') { sess.trShow = !sess.trShow; const bx = document.getElementById('trbox'); if (bx) bx.hidden = !sess.trShow; el.setAttribute('aria-pressed', String(sess.trShow)); }
  else if (a === 'know') { mark(sess.q[sess.i], true); next(); }
  else if (a === 'again') { mark(sess.q[sess.i], false); next(); }
  else if (a === 'say') speak(d.t, d.l);
  else if (a === 'hint') { sess.val = (document.getElementById('ans') || {}).value || ''; sess.hint = true; render(); }
  else if (a === 'skip') {
    const c = sess.q[sess.i];
    if (S.mode === 'fill') { sess.vals = [...document.querySelectorAll('.blank')].map(x => x.value); sess.arr = c.answers.map(() => 'no'); }
    else sess.val = (document.getElementById('ans') || {}).value || '';
    sess.res = 'no'; mark(c, false); render();
  }
  else if (a === 'next') next();
  else if (a === 'retry') { sess = newSess(sess.wrong.slice()); view = 'play'; render(); }
  else if (a === 'reset') {
    if (arm !== 'reset') { arm = 'reset'; render(); setTimeout(() => { if (arm === 'reset') { arm = ''; if (view === 'home') render(); } }, 4000); }
    else { const u = user(); if (u) { u.known = {}; u.miss = {}; u.hist = []; u.last = 0; } arm = ''; saveProgress(); render(); }
  }
});
render();
initDb();
</script>
</body></html>
